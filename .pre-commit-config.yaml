minimum_prek_version: "0.5.10"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
default_language_version:
  python: python3.15
exclude: ^\.hooks/

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        # exclude: \.(bat|cmd)$
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: detect-private-key
      - id: forbid-submodules
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-json
        # exclude: (^|/)\.vscode/|(tsconfig[^/]*|biome)\.json$
      # - id: check-toml
      # - id: check-symlinks
      # - id: check-ast
      # - id: debug-statements
      - id: no-commit-to-branch

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  # - repo: https://github.com/crate-ci/typos
  #   rev: v1.49.0
  #   hooks:
      # - id: typos
      #   args: [--force-exclude]
      #   types_or: [python, pyi, javascript, jsx, ts, tsx, css, rust, shell]
      #   stages: [pre-commit]

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-tables==1.0.0
          - mdformat-frontmatter==2.0.8

  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.17.6
  #   hooks:
      # - id: ruff-check
      #   args: [--fix]
      # - id: ruff-format
      #   types_or: [python, pyi, jupyter]

  # - repo: https://github.com/biomejs/pre-commit
  #   rev: v2.5.7
  #   hooks:
      # - id: biome-check
      #   exclude: ^\.claude/settings\.json$

  - repo: local
    hooks:
      - id: no-broken-encoding
        name: no broken encoding (U+FFFD or mojibake)
        entry: python .hooks/text_guard.py
        language: python
        types: [text]
      - id: ascii-only
        name: source must be ASCII
        entry: python .hooks/text_guard.py --ascii
        language: python
        types: [text]
        exclude: (?i)(^|/)(README|AGENTS|CHANGELOG)\.md$|^docs/|^\.(gitignore|gitattributes|pre-commit-config\.yaml)$
      - id: no-secret-tokens
        name: no API tokens in tracked files
        entry: python .hooks/secret_tokens.py
        language: python
        types: [text]
      - id: no-secret-tokens-push
        name: no API tokens or private keys in pushed commits
        entry: python .hooks/secret_tokens.py --pre-push
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: commit-message
        name: commit message meets the commit standard
        entry: python .hooks/commit_message.py --scopes=docs
        language: python
        stages: [commit-msg]
      - id: commit-message-push
        name: pushed commit messages meet the commit standard
        entry: python .hooks/commit_message.py --scopes=docs --pre-push
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ship-push
        name: pushed refs follow the change path
        entry: python .hooks/push_check.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]
