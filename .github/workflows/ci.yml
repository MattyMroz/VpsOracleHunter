name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hooks:
    name: Hooks
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: 0.5.10
          install-only: true

      # - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      #   with:
      #     components: rustfmt
      #     cache: false

      - name: Pull request messages
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          GIT_EDITOR: ":"
          COMMIT_MESSAGE_FINAL: "1"
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/message"
          if ! prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/message"; then
            echo "::error::pull request title or description breaks the commit message rules"
            exit 1
          fi

      - name: Pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          GIT_EDITOR: ":"
          COMMIT_MESSAGE_FINAL: "1"
        run: |
          case "$BEFORE" in
            *[!0]*) range="$BEFORE..$AFTER" ;;
            *) range="$AFTER^!" ;;
          esac
          for rev in "$BEFORE" "$AFTER"; do
            case "$rev" in *[!0]*) ;; *) continue ;; esac
            if ! git cat-file -e "$rev^{commit}" 2>/dev/null; then
              echo "::error::$rev is not in this clone; check the pushed commits locally"
              exit 1
            fi
          done
          failed=0
          shas=$(git rev-list --no-merges "$range")
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/message"; then
              echo "::error::commit $sha breaks the commit message rules"
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit hooks
        env:
          SKIP: no-commit-to-branch,changed-tests,changed-tests-bun,changed-tests-rust
        run: prek run --all-files --show-diff-on-failure

